name: Build desktop apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install build dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      # The shared driver generates the .icns icon, collects PySide6/Qt,
      # sqlite3, ctypes, translations (app/i18n.py), tray code and hotkeys.
      - name: Build macOS .app
        run: bash scripts/build_macos.sh

      - name: Verify build output
        run: |
          test -d "dist/macos/Clipboard Manager.app"
          test -f "dist/macos/Clipboard Manager.app/Contents/MacOS/Clipboard Manager"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-manager-macos-app
          path: "dist/macos/Clipboard Manager.app"
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install build dependencies
        run: |
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      # Built on a Windows runner: no macOS-to-Windows cross-compilation.
      # The onedir layout keeps the Qt runtime next to the executable.
      - name: Build Windows .exe
        shell: cmd
        run: scripts\build_windows.bat

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\windows\Clipboard Manager\Clipboard Manager.exe")) {
            throw "Windows build output not found"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-manager-windows-exe
          path: "dist/windows/"
          if-no-files-found: error
